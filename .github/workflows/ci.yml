name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A throwaway Postgres so the job can apply the real migration and run an
    # authenticated request. Without a database the build was "green" while
    # proving nothing about migrations or login.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: growcode_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # `growcode_ci` is deliberate: scripts/smoke-auth.mjs refuses to run against
    # a database whose name does not look disposable (*_ci, *_smoke, *_test).
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/growcode_ci?sslmode=disable"
      SMOKE_DATABASE_URL: "postgresql://ci:ci@localhost:5432/growcode_ci?sslmode=disable"
      AUTH_SECRET: "ci-dummy-secret-not-used-at-runtime-0000000000"
      AUTH_URL: "http://localhost:3000"
      AUTH_TRUST_HOST: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # Caches ~/.npm keyed on the lockfile hash. Never cache
          # node_modules: that would skip `prisma generate` on cached builds.
          cache: npm

      # .npmrc already sets legacy-peer-deps (vite 8 + @vitejs/plugin-react 6).
      # Explicit here so the reason shows up in the CI log.
      - name: Install
        run: npm ci --legacy-peer-deps

      # The provider must match prisma/schema.prisma (postgresql). A mysql:// URL
      # still builds (nothing connects during generate) and only fails at
      # runtime, far from the line that caused it.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Proves the committed migration runs on a clean server.
      - name: Apply migrations
        run: npx prisma migrate deploy

      # After applying the migration, schema and code must agree. Catches a
      # schema.prisma change committed without its migration.
      - name: Detect schema drift
        run: >-
          npx prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      # Signs in for real and asserts private routes answer 200. It resets the
      # disposable database with `db push --force-reset`, so it runs last.
      - name: Authenticated smoke test
        run: node scripts/smoke-auth.mjs
